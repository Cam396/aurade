# Which boot screen, and when.
#
# Written as a file rather than left to `plymouth-set-default-theme`, which is
# a script that edits this file. The image is built from a profile directory
# and the profile directory should say what the image contains.
[Daemon]
Theme=aurade
# Plymouth waits five seconds before showing anything by default, on the
# reasoning that a splash which appears and vanishes is worse than no splash.
# That reasoning is about a machine booting an installed system off an NVMe
# drive. This is a live image decompressing a squashfs off optical media or a
# USB stick, it takes tens of seconds, and five of them spent on black is five
# seconds of somebody wondering whether the machine took the boot.
ShowDelay=0
# How long to wait for a graphics device before giving up and drawing on the
# text console. Eight seconds rather than the default because a machine whose
# graphics take longer than that to appear is a machine whose owner is about
# to want the boot messages anyway.
DeviceTimeout=8
