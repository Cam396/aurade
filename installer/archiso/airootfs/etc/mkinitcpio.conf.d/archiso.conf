# Use the required display drivers instead of including the full KMS set.
#
# So the drivers are named instead. Intel, AMD, the three virtual GPUs and
# simpledrm for the EFI framebuffer cover essentially every machine this
# installs on, and between them they carry about 35MB of firmware rather than
# 145MB.
#
# nouveau is the one deliberately left out, and it is 107MB of the 145MB on its
# own. An NVIDIA machine still gets every driver and all of its firmware from
# the squashfs the moment the root filesystem is mounted, so nothing is lost
# except the boot screen appearing after that point rather than before it.
MODULES=(simpledrm vmwgfx virtio_gpu bochs qxl i915 xe amdgpu radeon)

# `plymouth` sits directly after `udev`.
#
# It has to be after `udev` because it needs device nodes to find a graphics
# card at all, and it wants to be as early as possible after that, because
# every hook before it is time the screen spends black.
#
# The hook copies the theme named in /etc/plymouth/plymouthd.conf into the
# initramfs along with its plugin, so the boot screen and the file that
# chooses it have to stay in step. Changing the theme name in one place and
# not the other produces a boot that falls back to scrolling kernel messages,
# which is not a crash and is easy to miss.
HOOKS=(base udev plymouth microcode modconf memdisk archiso block filesystems keyboard)
COMPRESSION="zstd"
