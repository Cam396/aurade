# The installer's Broadcom Wi-Fi: wl on the chips only Broadcom's wl drives,
# the open drivers everywhere else.
#
# wl says it drives any Wi-Fi card of any maker, so left to itself it would
# load on nearly every laptop. It is loaded by name instead, for those chips
# only, by /etc/udev/rules.d/60-aurade-live-wl.rules.
blacklist wl
# The open drivers claim some of those chips and fail on them. On those
# machines they give way to wl, and load as usual on every other one. See
# /usr/local/lib/aurade/aurade-live-wl-guard.
install bcma /usr/local/lib/aurade/aurade-live-wl-guard bcma $CMDLINE_OPTS
install ssb /usr/local/lib/aurade/aurade-live-wl-guard ssb $CMDLINE_OPTS
install b43 /usr/local/lib/aurade/aurade-live-wl-guard b43 $CMDLINE_OPTS
install brcmsmac /usr/local/lib/aurade/aurade-live-wl-guard brcmsmac $CMDLINE_OPTS
