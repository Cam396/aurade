[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DisableDownloadTimeout
SigLevel = Required DatabaseOptional
# The live image defaults to strict local-file verification. The staging
# script writes an explicit development-unsigned policy only when requested.
LocalFileSigLevel = Required

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
