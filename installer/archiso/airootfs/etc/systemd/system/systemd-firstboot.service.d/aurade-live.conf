[Unit]
# AuraDE compatibility: the live image has an intentionally empty root
# password and an autologin console.  systemd-firstboot is for an installed
# machine with no configured identity; on the live image it presents a
# timezone/hostname questionnaire before the installer and can look like a
# hung or broken boot.  Keep the live environment deterministic and let the
# installer collect these values explicitly.
ConditionPathExists=/run/aurade-live-firstboot-enabled
