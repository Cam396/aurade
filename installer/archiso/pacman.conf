[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DisableDownloadTimeout
SigLevel = Required DatabaseOptional
# Local package files are required to carry signatures. Development images
# built with AURADE_ALLOW_UNSIGNED=1 make the exception explicit at staging
# time; normal ISO builds never silently weaken this policy.
LocalFileSigLevel = Required

[core]
Server = https://archive.archlinux.org/repos/__AURADE_ARCH_SNAPSHOT__/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/__AURADE_ARCH_SNAPSHOT__/$repo/os/$arch
