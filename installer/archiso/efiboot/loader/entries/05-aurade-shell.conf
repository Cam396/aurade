title    Recovery console
sort-key 05
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
# A root shell and nothing started for you. This is the entry for rolling a
# system back, collecting evidence from a failed install, or running the
# installer by hand with arguments; `aurade-recovery --help` is the way in.
#
# No `splash`. Somebody who picked this entry picked it to see what the
# machine is doing, and hiding the boot behind a logo is the opposite of the
# thing they asked for.
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G quiet aurade.installer=none
