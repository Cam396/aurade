title    AuraDE installer and recovery (%ARCH%, UEFI)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
# AuraDE compatibility: the installer prefetches the pinned Arch base set
# before touching the target disk. Give the live overlay enough writable
# space for that transaction instead of failing with "Partition / too full".
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G
