title    Install AuraDE
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
# AuraDE compatibility: the installer prefetches the pinned Arch base set
# before touching the target disk. Give the live overlay enough writable
# space for that transaction instead of failing with "Partition / too full".
#
# `aurade.installer=gui` is read by aurade-installer-autostart on tty1. It
# asks for the graphical installer and lets it negotiate a renderer; if none
# works, it ends at the text installer, which is the same installer.
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G quiet aurade.installer=gui
