title    Install AuraDE (safe graphics)
sort-key 04
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
# The graphical installer with every acceleration path skipped: the compositor
# composites in software and GTK draws with cairo. Slower, and it works on a
# machine whose graphics stack is broken in a way the negotiation cannot see -
# a driver that reports success and then draws nothing, which is the failure
# that leaves a black screen and no message.
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G quiet aurade.installer=safe
