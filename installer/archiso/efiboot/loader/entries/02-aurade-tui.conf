title    Install AuraDE (text only)
sort-key 02
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
# The text installer, chosen rather than fallen back to. Same questions, same
# engine, same journal; it asks for a keyboard and nothing else.
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G quiet aurade.installer=text
