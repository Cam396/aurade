title    Install AuraDE with speech
sort-key 02
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
# Second in the menu on purpose, and the position is part of the feature.
#
# Nobody who needs this entry can read the menu to find it, so it has to be
# reachable by counting rather than by looking: boot the image, press Down
# once, press Enter. First place is the default and belongs to the common
# case; second is the closest place to it that can be described in six words.
#
# `aurade.installer=speech` starts espeakup and then the text installer in
# plain mode. The text installer rather than the graphical one because
# espeakup reads the console directly, before any toolkit is loaded, which
# makes it the front end that speaks in the situations where the other one
# cannot start at all.
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G quiet aurade.installer=speech
