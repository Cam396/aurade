title    Install AuraDE over a serial console
sort-key 06
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
# For a machine with no screen attached to it.
#
# Servers, embedded boards and half the virtual machines anybody tests an
# installer on are reached over a serial line and nothing else, and until now
# the only way in was the recovery console plus a typed command. This is the
# same text installer, on ttyS0, started for you.
#
# Both consoles are named on purpose. The kernel sends its messages to every
# console listed, and the last one named is the one that gets /dev/console, so
# putting tty0 last means somebody who does have a screen attached still sees
# the boot. The installer itself is put on ttyS0 by its own unit, which is the
# only part of this that has to choose.
#
# 115200 because it is what every serial console defaults to now, and a wrong
# baud rate looks exactly like a machine that did not boot.
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G quiet console=ttyS0,115200n8 console=tty0 aurade.installer=serial
