# AuraDE optional local AI defaults.
#
# This file is installed only by the optional aurade-ai package. Installing
# normal AuraDE does not install Ollama and does not download AI models.

# Ollama is the first local runtime target because Arch ships it in extra and
# Google's Gemma docs provide an official Ollama path. The E2B instruction QAT
# tag is the default because it is smaller than the E2B Q4_K_M tag.
AURADE_LOCAL_AI_BACKEND=ollama
AURADE_LOCAL_AI_MODEL=gemma4:e2b-it-qat
AURADE_LOCAL_AI_ENDPOINT=http://127.0.0.1:11434

# The AuraDE launcher only calls aurade-ai-bootstrap for advanced_plus_ai.
# Within that tier, the model should be pulled automatically when missing.
AURADE_LOCAL_AI_AUTO_DOWNLOAD=1
AURADE_LOCAL_AI_START_OLLAMA=1
