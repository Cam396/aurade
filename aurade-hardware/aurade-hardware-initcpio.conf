# AuraDE hardware: the built-in keyboard at the disk unlock prompt. Sourced by
# /etc/mkinitcpio.conf.d/90-aurade-hardware.conf.
#
# On an encrypted install the passphrase is typed before the system is up,
# with only the drivers in the initramfs, and mkinitcpio's keyboard hook
# carries the usual ones: USB, i2c and the like. Two families of laptop wire
# their built-in keyboard some other way, and their owners could not type the
# passphrase at all:
#
#   Surface laptops   through Microsoft's Surface Aggregator, a controller on
#                     a serial line: surface_kbd on the Laptop 1 and 2,
#                     surface_hid on the Laptop 3 on, the Book 3 and the
#                     Studio.
#   2015 to 2017 Macs over SPI, with applespi: MacBook8,1 to 10,1 and
#                     MacBookPro13,x and 14,x.
#
# The machine this initramfs is built on decides, from the name its firmware
# gives it. Every module is optional (the trailing ?), so a kernel that lacks
# one still builds.
_aurade_product=
if [[ -r ${AURADE_HW_ROOT:-}/sys/class/dmi/id/product_name ]]; then
  read -r _aurade_product <"${AURADE_HW_ROOT:-}/sys/class/dmi/id/product_name" || :
fi
case $_aurade_product in
  'Surface Laptop'|'Surface Laptop 2')
    MODULES+=(surface_aggregator? surface_aggregator_registry? surface_aggregator_hub?
              surface_hid_core? surface_kbd? 8250_dw? intel_lpss? intel_lpss_pci?
              pinctrl_sunrisepoint?)
    ;;
  'Surface Laptop '*|'Surface Book 3'|'Surface Laptop Studio'*)
    MODULES+=(surface_aggregator? surface_aggregator_registry? surface_aggregator_hub?
              surface_hid_core? surface_hid? 8250_dw? intel_lpss? intel_lpss_pci?
              pinctrl_icelake? pinctrl_tigerlake? pinctrl_alderlake? pinctrl_amd?)
    ;;
  MacBook8,1|MacBook9,1|MacBook10,1|MacBookPro13,[123]|MacBookPro14,[123])
    MODULES+=(intel_lpss_pci? spi_pxa2xx_platform? spi_pxa2xx_pci? applespi?)
    ;;
esac
unset _aurade_product
