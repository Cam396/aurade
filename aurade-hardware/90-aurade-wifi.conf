# AuraDE: Wi-Fi power saving is off, on every card.
#
# Power saving lets the card doze between the access point's beacons. On some
# chips it costs far more than it saves: the Marvell card in Surface laptops
# crawls or stalls with it on, and on most cards every answer arrives later.
# What it saves is small next to what the screen uses.
[connection]
wifi.powersave=2
