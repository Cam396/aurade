# AuraDE hardware: the built-in keyboard at the disk unlock prompt, on Surface
# laptops and 2015 to 2017 Macs. The rules are in the file below, which the
# aurade-hardware package updates. They live under /usr/lib/initcpio so that
# installing or updating the package rebuilds the initramfs: an initramfs made
# before it was installed would not have the keyboard in it.
. "${AURADE_HW_INITCPIO:-/usr/lib/initcpio/aurade-hardware.conf}"
