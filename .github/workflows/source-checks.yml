name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    # A real terminal type: without it the installer's text UI takes its
    # no-TERM accessibility path and renders unframed, which the render
    # alignment fixture then measures as misaligned. A serial console
    # reports a real TERM; a bare runner does not.
    env:
      TERM: xterm-256color
      # Pin a UTF-8 locale too: without it bash counts the progress
      # bar's braille glyphs by byte and the frame padding lands wrong.
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Install source-check dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools squashfs-tools gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-glib-2.0

      - name: Verify archive tooling
        shell: bash
        run: |
          set -euo pipefail
          command -v bsdtar
          bsdtar --version
          command -v mksquashfs
          command -v unsquashfs

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do bash -n "$file"; done < <(find . -type f -name '*.sh' -not -path './.git/*' -print)

      - name: Check Python syntax without bytecode output
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import pathlib

          for path in pathlib.Path('.').rglob('*.py'):
              if '.git' in path.parts or '__pycache__' in path.parts:
                  continue
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY

      - name: Check patch series manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t patches < <(sed '/^[[:space:]]*#/d;/^[[:space:]]*$/d' patches/SERIES)
          test "${#patches[@]}" -gt 0
          for patch in "${patches[@]}"; do test -f "patches/${patch}"; done
          test "$(printf '%s\n' "${patches[@]}" | sort -u | wc -l)" -eq "${#patches[@]}"

      - name: Check generated package metadata is present
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r package; do test -f "${package}/PKGBUILD"; test -f "${package}/.SRCINFO"; done < installer/expected-packages.txt

      - name: Verify the release identity
        run: ci/verify-release-identity.sh

      - name: Run source integrity gate
        run: ci/source-integrity-gate.sh

      - name: Run public release leak gate
        run: ci/public-release-leak-gate.sh

      - name: Run public documentation gate
        run: ci/public-docs-gate.sh

      - name: Run GTK/libadwaita widget introspection gate
        run: python3 installer/tests/gui_widgets_test.py

      - name: Run installer source and refusal tests
        run: installer/tests/run.sh

      - name: Run every ci/tests fixture
        run: ci/tests/run.sh

      - name: Run host bridge tests
        run: aurade-host-bridge/run-tests.sh

      - name: Run NetworkManager adapter tests
        run: python3 shill-nm-adapter/test_shill_nm_adapter.py

      - name: Run session error fixture
        run: bash chromiumos-ash/test-session-error.sh chromiumos-ash/aurade-session-error

      - name: Check whitespace
        run: git diff --check
