# An AuraDE session (XDG_CURRENT_DESKTOP=AuraDE). Ash answers whether the
# desktop is light or dark and what its accent is, and its file chooser,
# AuraDE Files, is the one an application asking the portal for a file
# gets; GTK's backend answers the rest, and fills in any setting Ash does
# not have.
[preferred]
default=gtk
org.freedesktop.impl.portal.Settings=aurade;gtk
org.freedesktop.impl.portal.FileChooser=aurade
