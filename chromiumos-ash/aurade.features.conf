# AuraDE feature toggles for chromiumos-ash.
#
# Expose system-level Linux volumes such as /, /home, /mnt, /opt, and
# /usr/local in the Files app. Common user directories are shown regardless.
AURADE_EXPOSE_SYSTEM_VOLUMES=0

# Disable Chrome's process sandboxes. Keep this disabled for daily use; set it
# only for constrained test environments that cannot launch sandboxed Chrome.
AURADE_DISABLE_SANDBOX=0

# Ozone platform for Ash. Leave empty to auto-select Wayland when
# WAYLAND_DISPLAY is present, otherwise X11. Set to drm for direct-KMS tests.
AURADE_OZONE_PLATFORM=

# Developer-only OOBE bypass for local smoke tests. Do not enable in packaged
# daily-driver sessions; real setup, EULA, and consent screens must be shown.
AURADE_DEV_STUB_OOBE=0

# Show the AuraDE local-account setup card in OOBE. This is enabled for
# packaged AuraDE sessions and does not bypass legal or consent screens.
AURADE_ENABLE_LOCAL_ACCOUNTS=1

# Optional Ash host window bounds, for nested compositor or VM sessions where
# Ash cannot infer the real output size. Leave empty for normal hardware.
# Example: AURADE_ASH_HOST_WINDOW_BOUNDS=1280x800
AURADE_ASH_HOST_WINDOW_BOUNDS=

# Disable the automatic ChromeVox idle hint timer. The accessibility settings
# screen remains available, but the auto prompt depends on ChromeOS TTS assets
# that are not always present in Linux packages and can block OOBE input.
AURADE_DISABLE_CHROMEVOX_HINT_TIMER=1

# AuraDE runs ChromeOS display code on generic Linux graphics stacks. Keep the
# session alive if GPU output-surface creation fails and let Chromium disable
# GPU compositing instead of killing the shell.
AURADE_ALLOW_GPU_COMPOSITING_FALLBACK=1

# Feature profile override. Leave empty for automatic standard/plus selection.
# Advanced Plus AI only downloads a model when the optional aurade-ai package is
# installed and this profile is active.
# Example: AURADE_FEATURE_PROFILE=advanced_plus_ai
AURADE_FEATURE_PROFILE=

# Optional Advanced Plus AI bootstrap controls. These do nothing unless
# AURADE_FEATURE_PROFILE=advanced_plus_ai and /usr/bin/aurade-ai-bootstrap is
# installed by the optional aurade-ai package.
AURADE_LOCAL_AI_BOOTSTRAP=1
AURADE_LOCAL_AI_AUTO_DOWNLOAD=1
